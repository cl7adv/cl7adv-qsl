<script>
(() => {
'use strict';

/* ============================================================
   0. CONFIGURACIÓN CLAVE
   ============================================================ */
const GITHUB_REPO   = 'cl7adv/cl7adv-qsl';
const GITHUB_BRANCH = 'main';
const GITHUB_DIR    = 'imagenes';

// jsDelivr (CORS ✔) para las imágenes
const CDN_BASE = `https://cdn.jsdelivr.net/gh/${GITHUB_REPO}@${GITHUB_BRANCH}/${GITHUB_DIR}/`;

// Índice local (mismo dominio, sin CORS)
const LOCAL_INDEX_URL = `${GITHUB_DIR}/index.json`;

// Índice de respaldo embebido (se rellena con “Generar índice”)
let FALLBACK_INDEX = [];   // ← pega aquí el JSON generado

const IMG_EXT = /\.(jpe?g|png|gif|webp|bmp|avif|svg)$/i;
const PLACEHOLDER = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="240" height="160">' +
    '<rect width="240" height="160" fill="#eef2f5"/>' +
    '<g fill="#9aa7b4" font-family="sans-serif" text-anchor="middle">' +
    '<text x="120" y="84" font-size="18" font-weight="700">QSL</text>' +
    '<text x="120" y="106" font-size="11">sin imagen</text></g></svg>'
);

/* ============================================================
   1. INTERNACIONALIZACIÓN (sin cambios)
   ============================================================ */
const I18N = { /* … mismo diccionario … */ };
let lang = localStorage.getItem('qsl.lang') || 'es';
if (!I18N[lang]) lang = 'es';
function t(key, vars) { /* … */ }

/* ============================================================
   2. ESTADO
   ============================================================ */
const state = {
    all: [], results: [], query: '', band: '', mode: '',
    view: 'table', current: null, source: 'none'
};

/* ============================================================
   3. DOM REFS (sin cambios)
   ============================================================ */
// … (los mismos $, input, searchBtn, etc.)

/* ============================================================
   4. UTILIDADES MEJORADAS
   ============================================================ */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => (
    { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]
));
const norm = s => String(s ?? '').toUpperCase().trim();

/* ▼▼▼  EXTRACCIÓN ROBUSTA DE INDICATIVOS  ▼▼▼ */
function extractAllCallsigns(str) {
    // 1) Quitar extensión y pasar a mayúsculas
    let base = String(str).replace(/\.[^.]+$/, '').toUpperCase();

    // 2) Reemplazar separadores por espacios (paréntesis, guiones, etc.)
    base = base.replace(/[^A-Z0-9]+/g, ' ');

    // 3) Buscar tokens que parezcan indicativos
    const tokens = base.split(/\s+/).filter(Boolean);
    const found = new Set();

    for (const tk of tokens) {
        // Quitar sufijos tipo "-2", "_P", etc.
        const clean = tk.replace(/[^A-Z0-9]/g, '');

        // Patrón estándar: 1-2 letras + 1-3 dígitos + 1-4 letras
        //   ej: CM7ADV, CO5ABC, W1AW, 4N1UBG
        if (/^\d?[A-Z]{1,2}\d[A-Z]{1,4}$/.test(clean) && /\d/.test(clean)) {
            found.add(clean);
        }
        // También captura indicativos con dígito inicial (ej: 4N1UBG)
        else if (/^\d[A-Z]{1,2}\d[A-Z]{1,4}$/.test(clean)) {
            found.add(clean);
        }
    }

    // 4) Si no encontró nada, intentar un patrón más laxo sobre el nombre original
    if (found.size === 0) {
        const matches = base.match(/\b[A-Z]{1,2}\d[A-Z]{1,4}\b/g);
        if (matches) matches.forEach(m => found.add(m));
    }

    return [...found];
}

/* Deduce metadatos desde el nombre del archivo */
function parseFileName(name) {
    const base = String(name).replace(/\.[^.]+$/, '');
    const up = base.toUpperCase();

    const bm = up.match(/(?:^|[^0-9])(160|80|60|40|30|20|17|15|12|10|6|2)M(?:[^A-Z]|$)/);
    const mm = up.match(/(?:^|[^A-Z])(SSB|USB|LSB|CW|FT8|FT4|FT2|RTTY|AM|FM|PSK31|PSK63|JS8|MFSK|DIGI|OLIVIA)(?:[^A-Z]|$)/);
    const dm = up.match(/\b(20\d{2})[-_.]?(0[1-9]|1[0-2])?[-_.]?(0[1-9]|[12]\d|3[01])?\b/);

    let date = '';
    if (dm) date = dm[1] + (dm[2] ? '-' + dm[2] : '') + (dm[3] ? '-' + dm[3] : '');

    return {
        callsigns: extractAllCallsigns(base),
        band: bm ? bm[1] + 'm' : '',
        mode: mm ? mm[1] : '',
        date
    };
}

/* ============================================================
   5. CARGA DEL ÍNDICE (3 niveles)
   ============================================================ */
function normalizeEntry(raw, i) {
    if (!raw) return null;
    const rawFile = String(raw.file || raw.filename || raw.src || '');
    const fileName = rawFile.replace(/^.*[\\/]/, '');
    if (!fileName) return null;

    const meta = parseFileName(fileName);
    const url = CDN_BASE + encodeURIComponent(fileName); // jsDelivr ✔ CORS

    return {
        id: 'i' + i,
        fileName,
        url,
        callsigns: meta.callsigns,
        name: raw.name || raw.operator || '',
        band: raw.band || meta.band,
        mode: norm(raw.mode || meta.mode),
        date: raw.date || meta.date
    };
}

async function loadIndex() {
    // 1️⃣  index.json local
    try {
        const res = await fetch(LOCAL_INDEX_URL, { cache: 'no-cache' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        const arr = Array.isArray(data) ? data : (data.items || data.qsls || []);
        const entries = arr.map(normalizeEntry).filter(Boolean);
        if (!entries.length) throw new Error('índice vacío');

        state.all = entries;
        state.source = 'index';
        buildFilterOptions();
        return true;
    } catch (err) {
        console.info('[QSL] Sin index.json local:', err.message);
    }

    // 2️⃣  índice de respaldo embebido
    if (Array.isArray(FALLBACK_INDEX) && FALLBACK_INDEX.length) {
        const entries = FALLBACK_INDEX.map(normalizeEntry).filter(Boolean);
        if (entries.length) {
            state.all = entries;
            state.source = 'index';
            buildFilterOptions();
            return true;
        }
    }

    // 3️⃣  API de GitHub (último recurso, sujeto a límite de 60/h)
    try {
        const apiUrl = `https://api.github.com/repos/${GITHUB_REPO}/contents/${GITHUB_DIR}`;
        const res = await fetch(apiUrl, {
            headers: { 'Accept': 'application/vnd.github.v3+json' }
        });
        if (!res.ok) throw new Error('HTTP ' + res.status + ' (¿límite de API?)');
        const items = await res.json();
        const entries = items
            .filter(it => it.type === 'file' && IMG_EXT.test(it.name))
            .map((it, idx) => normalizeEntry({ file: it.name }, idx))
            .filter(Boolean);

        if (!entries.length) throw new Error('No hay imágenes');

        state.all = entries;
        state.source = 'index';
        buildFilterOptions();
        return true;
    } catch (err) {
        console.warn('[QSL] Fallo total al cargar índice:', err.message);
        state.source = 'none';
        state.all = [];
        return false;
    }
}

/* ============================================================
   6. CARGA DESDE CARPETA LOCAL (sin cambios)
   ============================================================ */
function loadFromFolder(fileList) { /* … */ }

/* ============================================================
   7. FILTROS (sin cambios)
   ============================================================ */
// …

/* ============================================================
   8. BÚSQUEDA (adaptada a múltiples indicativos)
   ============================================================ */
function scoreEntry(e, q) {
    const csList = e.callsigns || [];
    const nm = norm(e.name);
    const fl = norm(e.fileName);

    for (const cs of csList) {
        if (cs === q) return 100;
        if (cs.startsWith(q)) return 80;
        if (cs.includes(q)) return 60;
    }
    if (nm && nm.includes(q)) return 40;
    if (fl.includes(q)) return 20;
    return 0;
}

function doSearch(raw) {
    const q = norm(raw ?? input.value);
    state.current = null;
    state.query = q;

    if (!q) { state.results = []; renderResults(); return; }

    // Feedback visual inmediato
    showMessage('fa-spinner fa-spin', t('message.searching'));

    setTimeout(() => {
        const scored = [];
        for (const e of state.all) {
            const s = scoreEntry(e, q);
            if (s > 0) scored.push([s, e]);
        }
        scored.sort((a, b) =>
            b[0] - a[0] ||
            (a[1].callsigns[0] || '').localeCompare(b[1].callsigns[0] || '') ||
            a[1].fileName.localeCompare(b[1].fileName)
        );

        state.results = scored.map(x => x[1]);
        renderResults();
    }, 80);
}

function getVisible() { /* … */ }

/* ============================================================
   9. SUGERENCIAS (adaptadas)
   ============================================================ */
function renderSuggestions() { /* … usa e.callsigns … */ }

/* ============================================================
   10-14. RESTO (render, descargas, eventos, etc.)
   ============================================================ */
// …

/* Genera index.json y lo descarga para que lo subas a /imagenes/ */
function generateIndex() {
    const items = state.all.map(e => ({
        file: e.fileName,
        callsign: (e.callsigns && e.callsigns[0]) || '',
        name: e.name || '',
        band: e.band || '',
        mode: e.mode || '',
        date: e.date || ''
    }));
    const blob = new Blob([JSON.stringify(items, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    triggerDownload(url, 'index.json');
    setTimeout(() => URL.revokeObjectURL(url), 4000);
}

/* ============================================================
   15. ARRANQUE
   ============================================================ */
async function init() {
    applyI18n();
    setView('table');

    const ok = await loadIndex();
    if (ok) {
        buildFilterOptions();
        renderStatus();
        showMessage('fa-circle-check',
            t('status.index'),
            t('status.count', { n: state.all.length }) + ' — ' + t('helper.text'));
    } else {
        renderStatus();
        showMessage('fa-triangle-exclamation',
            t('status.none'),
            'No se pudo cargar ningún índice. Revisa la consola (F12) o usa “Cargar carpeta”.');
    }
}

init();
})();
</script>
