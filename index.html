<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title data-i18n="app.title">QSL Caribe · Buscador de QSLs</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
/* ============================================================
   RESET Y GLOBALES
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box}
[hidden]{display:none !important}

body{
    min-height:100vh;display:flex;justify-content:center;align-items:center;padding:30px;
    font-family:'Inter',sans-serif;background:linear-gradient(160deg,#f0f4f8 0%,#ffffff 100%);
}

:root{
    --caribe:#0077b6;
    --caribe-light:#00b4d8;
    --caribe-deep:#006994;
    --ink:#1a1a2e;
    --muted:#7a7f8a;
    --line:#e1e5ea;
}

.card{
    position:relative;overflow:hidden;max-width:1300px;width:100%;
    background:#fff;border-radius:32px;padding:2.5rem 3rem 2rem;
    box-shadow:0 12px 40px rgba(0,0,0,.06);border:1px solid rgba(0,0,0,.03);
    animation:fadeIn .5s ease-out;
}
@keyframes fadeIn{0%{opacity:0;transform:translateY(15px)}100%{opacity:1;transform:translateY(0)}}

/* MARCA DE AGUA */
.watermark-box{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-25deg);
    font-size:12rem;font-weight:900;color:rgba(0,0,0,.03);pointer-events:none;z-index:0;
    text-transform:uppercase;white-space:nowrap;letter-spacing:15px;user-select:none;line-height:1;
}
.header-pano-container,.search-section,.result-container,.footer-modern{position:relative;z-index:1}

/* ============================================================
   CABECERA
   ============================================================ */
.header-pano-container{
    width:100%;height:220px;border-radius:24px;overflow:hidden;margin-bottom:2rem;
    display:flex;align-items:center;justify-content:center;position:relative;
    border:1px solid rgba(255,255,255,.2);box-shadow:0 8px 24px rgba(0,0,0,.04);
}
.header-pano-img{
    position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;
    filter:brightness(.65);pointer-events:none;
}
.header-pano-overlay{
    position:relative;z-index:1;text-align:center;padding:10px;
    display:flex;flex-direction:column;align-items:center;gap:.2rem;
}
.header-pano-overlay h1{
    font-weight:900;font-size:4rem;color:#fff;text-shadow:0 6px 20px rgba(0,0,0,.3);
    letter-spacing:-1px;line-height:1.1;
}
.header-pano-overlay .subtitle{
    font-weight:700;color:#fff;background:rgba(0,119,182,.85);
    padding:.3rem 1.8rem;border-radius:60px;font-size:1rem;letter-spacing:2px;
    border:1px solid rgba(255,255,255,.2);
}
.header-pano-overlay .sun-icon{
    font-size:2.2rem;color:#fff;text-shadow:0 4px 20px rgba(0,0,0,.6);
    animation:pulseGlow 4s ease-in-out infinite;
}
@keyframes pulseGlow{0%,100%{transform:scale(1) rotate(0deg)}50%{transform:scale(1.1) rotate(8deg)}}

/* ============================================================
   BUSCADOR
   ============================================================ */
.search-section{display:flex;flex-direction:column;align-items:center;gap:.8rem;margin:1rem 0 1.8rem}
.search-box{display:flex;flex-wrap:wrap;justify-content:center;gap:.8rem;width:100%}
.search-box input{
    flex:1 1 300px;padding:.9rem 1.8rem;border:2px solid var(--line);border-radius:60px;
    background:#f8fafc;font-family:'Inter',sans-serif;font-size:1.1rem;font-weight:700;
    color:var(--ink);transition:.3s;text-transform:uppercase;letter-spacing:1px;outline:none;
}
.search-box input:focus{background:#fff;border-color:var(--caribe);box-shadow:0 0 0 4px rgba(0,119,182,.15)}
.search-box button{
    padding:.9rem 2.4rem;border:none;border-radius:60px;background:var(--caribe);color:#fff;
    font-family:'Inter',sans-serif;font-weight:700;font-size:1.1rem;cursor:pointer;transition:.25s;
    box-shadow:0 4px 12px rgba(0,119,182,.25);display:inline-flex;align-items:center;gap:10px;
    text-transform:uppercase;letter-spacing:1px;
}
.search-box button:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,119,182,.35);background:var(--caribe-deep)}
.reset-btn{
    background:#f8fafc;color:#6c757d;border:2px solid var(--line);padding:.9rem 1.5rem;
    border-radius:60px;font-weight:700;font-size:1rem;cursor:pointer;transition:.2s;
    display:inline-flex;align-items:center;gap:8px;
}
.reset-btn:hover{background:#e9ecef;color:#333;border-color:#ccc}

.suggestions{
    list-style:none;background:#fff;border:1px solid var(--line);border-radius:20px;
    padding:.3rem 0;max-height:220px;overflow-y:auto;width:100%;max-width:420px;
    display:none;box-shadow:0 8px 24px rgba(0,0,0,.05);
}
.suggestions.show{display:block}
.suggestions li{
    padding:.6rem 1.5rem;cursor:pointer;font-weight:600;color:#333;transition:.15s;
    display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #f0f2f5;
}
.suggestions li:last-child{border-bottom:none}
.suggestions li:hover{background:#f8fafc;color:var(--caribe)}
.suggestions li .sug-meta{font-weight:500;color:var(--muted);font-size:.8rem}

/* ============================================================
   HELPER: FLAG COUNTER + IDIOMA
   ============================================================ */
.helper{
    font-size:.85rem;color:var(--muted);background:#f8fafc;padding:.5rem 1.8rem;border-radius:40px;
    border:1px solid var(--line);display:flex;align-items:center;gap:20px;flex-wrap:wrap;
    justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.02);
}
.helper-text{display:flex;align-items:center;gap:8px}
.flag-counter-wrapper{
    display:flex;align-items:center;background:#fff;padding:.2rem .2rem .2rem 1rem;
    border-radius:30px;border:1px solid #eef2f5;box-shadow:0 2px 6px rgba(0,0,0,.03);transition:.2s;
}
.flag-counter-wrapper:hover{border-color:var(--caribe-light);box-shadow:0 4px 12px rgba(0,119,182,.08)}
.flag-counter-wrapper span{font-weight:700;color:var(--caribe);margin-right:12px;font-size:.9rem;white-space:nowrap}
.flag-counter-wrapper img{border-radius:30px;height:28px;display:block}
.language-selector{
    display:flex;align-items:center;gap:6px;background:#fff;padding:.2rem .8rem .2rem 1rem;
    border-radius:30px;border:1px solid #eef2f5;box-shadow:0 2px 6px rgba(0,0,0,.03);
}
.language-selector select{
    border:none;background:transparent;font-family:'Inter',sans-serif;font-weight:600;
    font-size:.9rem;color:var(--ink);outline:none;cursor:pointer;padding:4px 0;
}

/* ============================================================
   RESULTADOS
   ============================================================ */
.result-container{
    min-height:200px;background:#f8fafc;border-radius:24px;padding:1.5rem 1.5rem;
    margin:1rem 0 1.8rem;border:1px solid var(--line);
}

/* Barra de estado / carpeta */
.status-bar{
    display:flex;flex-wrap:wrap;align-items:center;gap:.6rem;
    background:#fff;border:1px dashed #d7dee7;border-radius:16px;
    padding:.55rem .9rem;margin-bottom:1rem;font-size:.85rem;color:#5b6472;
}
.status-dot{width:9px;height:9px;border-radius:50%;background:#cbd5e1;flex:none}
.status-dot.ok{background:#16a34a;box-shadow:0 0 0 4px rgba(22,163,74,.12)}
.status-dot.warn{background:#f59e0b;box-shadow:0 0 0 4px rgba(245,158,11,.12)}
.status-spacer{flex:1}
.btn-soft{
    display:inline-flex;align-items:center;gap:7px;background:#f8fafc;color:#48505c;
    border:1px solid var(--line);border-radius:30px;padding:.4rem 1rem;font-family:'Inter',sans-serif;
    font-weight:700;font-size:.8rem;cursor:pointer;transition:.2s;white-space:nowrap;
}
.btn-soft:hover{background:#eef4f9;border-color:var(--caribe-light);color:var(--caribe)}

/* Filtros */
.filters-bar{
    display:flex;width:100%;justify-content:space-between;align-items:center;flex-wrap:wrap;
    gap:.8rem;margin-bottom:1.2rem;padding:.6rem 1.2rem;background:#fff;
    border-radius:20px;border:1px solid var(--line);
}
.filter-group{display:flex;gap:.5rem;flex-wrap:wrap}
.filter-group select{
    padding:.4rem 1rem;border:1px solid var(--line);border-radius:30px;background:#fff;
    font-family:'Inter',sans-serif;font-weight:600;color:var(--ink);cursor:pointer;outline:none;font-size:.85rem;
}
.filter-group select:focus{border-color:var(--caribe)}
.view-toggle{display:flex;gap:.3rem;background:#f1f4f8;padding:.25rem;border-radius:30px}
.view-toggle button{
    border:none;background:transparent;color:#8b93a1;width:38px;height:34px;border-radius:26px;
    cursor:pointer;transition:.2s;font-size:.9rem;
}
.view-toggle button.active{background:#fff;color:var(--caribe);box-shadow:0 2px 8px rgba(0,0,0,.05)}

/* Acciones */
.grid-actions{display:flex;justify-content:flex-end;margin-bottom:1rem}
.download-btn{
    background:linear-gradient(145deg,var(--caribe),var(--caribe-deep));color:#fff;
    padding:.6rem 1.8rem;border-radius:60px;font-weight:700;font-size:.9rem;border:none;cursor:pointer;
    transition:.2s;text-transform:uppercase;text-decoration:none;display:inline-flex;align-items:center;gap:8px;
}
.download-btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,119,182,.35)}
.download-btn:disabled{opacity:.6;cursor:progress;transform:none;box-shadow:none}

/* Mensajes */
.message{font-size:1.1rem;color:#6c757d;text-align:center;padding:1.6rem 1rem}
.message i{font-size:2.8rem;display:block;margin-bottom:.6rem;color:var(--caribe)}
.message .warm{color:var(--caribe);font-weight:700}
.message small{display:block;margin-top:.5rem;font-size:.85rem;color:var(--muted);font-weight:500}

/* Vistas */
.view{display:none}
.view.active{display:block}
.grid-view.active{display:grid}
.detail-view.active{display:flex}

.grid-view{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:1.5rem;width:100%}
.grid-item{
    background:#fff;border-radius:20px;padding:12px;box-shadow:0 4px 12px rgba(0,0,0,.04);
    text-align:center;border:1px solid #eef2f5;cursor:pointer;transition:.22s;
}
.grid-item:hover{transform:translateY(-4px);border-color:var(--caribe);box-shadow:0 10px 24px rgba(0,119,182,.12)}
.grid-item img{width:100%;height:140px;object-fit:cover;border-radius:12px;display:block;background:#eef2f5}
.gi-cs{font-weight:900;color:var(--ink);font-size:1rem;margin-top:.6rem;letter-spacing:.5px}
.gi-name{font-size:.75rem;color:var(--muted);font-weight:600;margin-top:.1rem}
.gi-chips{display:flex;gap:.3rem;justify-content:center;flex-wrap:wrap;margin-top:.5rem}
.chip{
    background:rgba(0,119,182,.08);color:var(--caribe);font-size:.68rem;font-weight:800;
    padding:.16rem .55rem;border-radius:20px;letter-spacing:.5px;text-transform:uppercase;
}

.table-wrap{overflow-x:auto;border-radius:16px;background:#fff;border:1px solid #eef2f5}
.table-view{width:100%;border-collapse:collapse;min-width:620px}
.table-view th{
    background:#f0f2f5;padding:.9rem 1rem;text-transform:uppercase;color:#6c757d;
    font-size:.72rem;letter-spacing:1px;text-align:left;
}
.table-view td{padding:.8rem 1rem;border-bottom:1px solid #f0f2f5;font-size:.88rem;color:#333}
.table-view tr:last-child td{border-bottom:none}
.table-view tbody tr:hover{background:#f8fafc}
.table-btn{
    background:#f8fafc;border:1px solid var(--line);padding:.3rem 1rem;border-radius:30px;
    font-weight:700;font-size:.75rem;cursor:pointer;transition:.2s;margin-right:.3rem;
}
.table-btn:hover{background:var(--caribe);color:#fff;border-color:var(--caribe)}

.detail-view{flex-direction:column;align-items:center;gap:1rem;width:100%}
.polaroid{
    background:#fff;padding:16px 16px 52px;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.06);
    border:1px solid #eef2f5;max-width:100%;display:inline-block;position:relative;
}
.polaroid img{max-width:100%;max-height:420px;border-radius:8px;object-fit:contain;display:block}
.polaroid .stamp{
    position:absolute;bottom:62px;right:20px;background:rgba(0,119,182,.12);color:var(--caribe);
    font-style:italic;font-size:1.1rem;font-weight:800;padding:.1rem 1rem;border-radius:30px;
    transform:rotate(12deg);
}
.detail-meta{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;max-width:760px}
.detail-meta .chip{font-size:.78rem;padding:.3rem .9rem}
.detail-actions{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center}

/* Footer */
.footer-modern{
    margin-top:1.8rem;text-align:center;font-size:.85rem;color:var(--muted);
    border-top:1px solid #f0f2f5;padding-top:1.2rem;
}
.footer-modern .creator{font-weight:700;font-size:1.2rem;color:var(--caribe)}

.spinner{
    display:inline-block;width:38px;height:38px;border:4px solid #eef2f5;border-top-color:var(--caribe);
    border-radius:50%;animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

@media (max-width:600px){
    .card{padding:1.2rem 1rem}
    .header-pano-container{height:160px}
    .header-pano-overlay h1{font-size:2.6rem}
    .flag-counter-wrapper{flex-direction:column;padding:.5rem;background:transparent;border:none;box-shadow:none}
    .flag-counter-wrapper span{margin:0 0 6px 0}
    .language-selector{padding:.2rem .6rem}
    .search-box button{flex:1 1 100%}
    .result-container{padding:1rem .8rem}
}
</style>
</head>
<body>

<main class="card" role="main">
    <div class="watermark-box" aria-hidden="true">Cuba</div>

    <!-- ================= CABECERA ================= -->
    <div class="header-pano-container">
        <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1200&h=400&fit=crop"
             class="header-pano-img" alt="Panorámica Caribe" />
        <div class="header-pano-overlay">
            <span class="sun-icon"><i class="fas fa-sun"></i></span>
            <h1 data-i18n="header.title">QSL Caribe</h1>
            <div class="subtitle" data-i18n="header.subtitle">Buscador de QSLs</div>
        </div>
    </div>

    <!-- ================= BUSCADOR ================= -->
    <section class="search-section">
        <div class="search-box">
            <input type="text" id="callsignInput" placeholder="Ej. CM7ADV, CO5..." maxlength="20"
                   autofocus autocomplete="off" spellcheck="false"
                   data-i18n-placeholder="search.placeholder" />
            <button id="searchBtn"><i class="fas fa-search"></i> <span data-i18n="search.button">Buscar</span></button>
            <button id="resetBtn" class="reset-btn"><i class="fas fa-home"></i> <span data-i18n="reset.button">Inicio</span></button>
        </div>

        <ul class="suggestions" id="suggestionsList"></ul>

        <div class="helper">
            <span class="helper-text"><i class="fas fa-info-circle"></i> <span data-i18n="helper.text">Escribe el indicativo</span></span>
            <div class="flag-counter-wrapper">
                <span data-i18n="helper.visitors">Visitantes</span>
                <a href="https://info.flagcounter.com/NpPc">
                    <img src="https://s01.flagcounter.com/count2/NpPc/bg_FFFFFF/txt_000000/border_CCCCCC/columns_8/maxflags_250/viewers_0/labels_0/pageviews_0/flags_0/percent_0/" alt="Flag Counter" border="0" />
                </a>
            </div>
            <div class="language-selector">
                <i class="fas fa-globe" style="color:var(--caribe)"></i>
                <select id="languageSelect">
                    <option value="es">🇪🇸 Español</option>
                    <option value="en">🇬🇧 English</option>
                    <option value="zh">🇨🇳 中文</option>
                    <option value="ja">🇯🇵 日本語</option>
                    <option value="de">🇩🇪 Deutsch</option>
                </select>
            </div>
        </div>
    </section>

    <!-- ================= RESULTADOS ================= -->
    <section class="result-container" id="resultContainer">

        <!-- Estado / origen de las imágenes -->
        <div class="status-bar">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">—</span>
            <span class="status-spacer"></span>
            <button class="btn-soft" id="loadFolderBtn">
                <i class="fas fa-folder-open"></i> <span data-i18n="actions.loadFolder">Cargar carpeta</span>
            </button>
            <button class="btn-soft" id="genIndexBtn" hidden>
                <i class="fas fa-file-code"></i> <span data-i18n="actions.generateIndex">Generar índice</span>
            </button>
        </div>

        <!-- Filtros -->
        <div class="filters-bar" id="filtersBar" hidden>
            <div class="filter-group">
                <select id="bandFilter"><option value="" data-i18n="filters.all_bands">Todas las bandas</option></select>
                <select id="modeFilter"><option value="" data-i18n="filters.all_modes">Todos los modos</option></select>
            </div>
            <div class="view-toggle">
                <button data-view="grid" id="viewGridBtn" title="Grid"><i class="fas fa-th-large"></i></button>
                <button data-view="table" id="viewTableBtn" class="active" title="Lista"><i class="fas fa-list"></i></button>
            </div>
        </div>

        <!-- Acciones masivas -->
        <div class="grid-actions" id="gridActions" hidden>
            <button class="download-btn" id="downloadAllBtn">
                <i class="fas fa-file-zipper"></i> <span data-i18n="actions.downloadAll">Descargar ZIP</span>
            </button>
        </div>

        <!-- Mensaje central -->
        <div class="message" id="resultMessage">
            <i class="fas fa-radio"></i>
            <span data-i18n="message.waiting">Esperando tu búsqueda...</span>
        </div>

        <!-- Vistas -->
        <div class="view grid-view" id="gridView"></div>

        <div class="view table-wrap" id="tableView">
            <table class="table-view">
                <thead>
                    <tr>
                        <th data-i18n="table.callsign">Indicativo</th>
                        <th data-i18n="table.name">Nombre</th>
                        <th data-i18n="table.band">Banda</th>
                        <th data-i18n="table.mode">Modo</th>
                        <th data-i18n="table.date">Fecha</th>
                        <th data-i18n="table.actions">Acciones</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>

        <div class="view detail-view" id="detailView"></div>
    </section>

    <footer class="footer-modern">
        <div class="creator">ZMR Cuba</div>
        <div data-i18n="footer.text">QSL Caribe — Buscador de tarjetas QSL</div>
    </footer>

    <!-- Input oculto para seleccionar la carpeta de imágenes -->
    <input type="file" id="folderInput" webkitdirectory directory multiple hidden />
</main>

<script>

let lang = localStorage.getItem('qsl.lang') || 'es';
if (!I18N[lang]) lang = 'es';

function t(key, vars) {
    const dict = I18N[lang] || I18N.es;
    let s = dict[key] ?? I18N.es[key] ?? key;
    if (vars) for (const k in vars) s = s.split('{' + k + '}').join(vars[k]);
    return s;
}

/* ============================================================
   2. ESTADO
   ============================================================ */
const state = {
    all: [],          // todas las QSL indexadas
    results: [],      // resultados de la búsqueda actual
    query: '',
    band: '',
    mode: '',
    view: 'table',
    current: null,    // QSL en vista detalle
    source: 'none'    // 'index' | 'folder' | 'none'
};

/* ============================================================
   3. REFERENCIAS DOM
   ============================================================ */

/* ============================================================
   4. UTILIDADES
   ============================================================ */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => (
    { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]
));

const norm = s => String(s ?? '').toUpperCase().trim();

/* Extrae un indicativo de un nombre de archivo / texto */
function extractCallsign(str) {
    const tokens = norm(str).split(/[^A-Z0-9]+/).filter(Boolean);
    for (const tk of tokens) {
        const cand = tk.replace(/-\d+$/, '');          // CM7ADV-2 -> CM7ADV
        if (/^\d?[A-Z]{1,3}\d[A-Z]{1,4}$/.test(cand) && /\d/.test(cand)) return cand;
    }
    return '';
}

/* Deduce metadatos desde el nombre del archivo */
function parseFileName(name) {
    const base = String(name).replace(/\.[^.]+$/, '');
    const up = base.toUpperCase();

    const bm = up.match(/(?:^|[^0-9])(160|80|60|40|30|20|17|15|12|10|6|2)M(?:[^A-Z]|$)/);
    const mm = up.match(/(?:^|[^A-Z])(SSB|USB|LSB|CW|FT8|FT4|FT2|RTTY|AM|FM|PSK31|PSK63|JS8|MFSK|DIGI|OLIVIA)(?:[^A-Z]|$)/);
    const dm = up.match(/\b(20\d{2})[-_.]?(0[1-9]|1[0-2])?[-_.]?(0[1-9]|[12]\d|3[01])?\b/);

    let date = '';
    if (dm) date = dm[1] + (dm[2] ? '-' + dm[2] : '') + (dm[3] ? '-' + dm[3] : '');

    return {
        callsign: extractCallsign(base),
        band: bm ? bm[1] + 'm' : '',
        mode: mm ? mm[1] : '',
        date
    };
}

/* ============================================================
   5. CARGA DEL ÍNDICE
   ============================================================ */
function normalizeEntry(raw, i) {
    if (!raw) return null;
    const rawFile = String(raw.file || raw.filename || raw.src || '');
    const fileName = rawFile.replace(/^.*[\\/]/, '');
    if (!fileName) return null;

    const meta = parseFileName(fileName);
    const url = /^(https?:|blob:|data:)/i.test(rawFile)
        ? rawFile
        : IMAGES_DIR + encodeURIComponent(fileName);

    return {
        id: 'i' + i,
        fileName,
        url,
        callsign: norm(raw.callsign || meta.callsign),
        name: raw.name || raw.operator || '',
        band: raw.band || meta.band,
        mode: norm(raw.mode || meta.mode),
        date: raw.date || meta.date
    };
}

async function loadIndex() {
    try {
        const res = await fetch(INDEX_URL, { cache: 'no-cache' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        const arr = Array.isArray(data) ? data : (data.items || data.qsls || []);
        const entries = arr.map(normalizeEntry).filter(Boolean);

        if (!entries.length) throw new Error('índice vacío');

        state.all = entries;
        state.source = 'index';
        buildFilterOptions();
        return true;
    } catch (err) {
        console.info('[QSL] No se pudo cargar index.json:', err.message);
        state.source = 'none';
        state.all = [];
        return false;
    }
}

/* ============================================================
   6. CARGA DESDE CARPETA LOCAL
   ============================================================ */
function loadFromFolder(fileList) {
    // liberar URLs anteriores
    state.all.forEach(e => { if (e._objUrl) URL.revokeObjectURL(e.url); });

    const files = Array.from(fileList).filter(f => IMG_EXT.test(f.name));
    if (!files.length) {
        alert(t('message.noImages') + ' — ' + t('message.noImagesHint'));
        return;
    }

    state.all = files.map((f, i) => {
        const meta = parseFileName(f.name);
        return {
            id: 'f' + i,
            fileName: f.name,
            url: URL.createObjectURL(f),
            _objUrl: true,
            file: f,
            callsign: meta.callsign,
            name: '',
            band: meta.band,
            mode: meta.mode,
            date: meta.date
        };
    }).sort((a, b) =>
        (a.callsign || '~').localeCompare(b.callsign || '~') ||
        a.fileName.localeCompare(b.fileName)
    );

    state.source = 'folder';
    state.results = [];
    state.current = null;

    buildFilterOptions();
    renderStatus();
    renderResults();
    genIndexBtn.hidden = false;
}

/* ============================================================
   7. FILTROS
   ============================================================ */
function bandSort(a, b) {
    const n = s => parseInt(s, 10) || 0;
    return n(b) - n(a);
}

function fillSelect(select, allLabel, values, current) {
    select.innerHTML = '';
    const opt0 = document.createElement('option');
    opt0.value = '';
    opt0.textContent = allLabel;
    select.appendChild(opt0);
    values.forEach(v => {
        const o = document.createElement('option');
        o.value = v;
        o.textContent = v;
        select.appendChild(o);
    });
    select.value = values.includes(current) ? current : '';
}

function buildFilterOptions() {
    const bands = [...new Set(state.all.map(e => e.band).filter(Boolean))].sort(bandSort);
    const modes = [...new Set(state.all.map(e => e.mode).filter(Boolean))].sort();

    fillSelect(bandFilter, t('filters.all_bands'), bands, state.band);
    fillSelect(modeFilter, t('filters.all_modes'), modes, state.mode);

    state.band = bandFilter.value;
    state.mode = modeFilter.value;
}

/* ============================================================
   8. BÚSQUEDA
   ============================================================ */
function scoreEntry(e, q) {
    const cs = e.callsign || '';
    const nm = norm(e.name);
    const fl = norm(e.fileName);

    if (cs && cs === q) return 100;
    if (cs && cs.startsWith(q)) return 80;
    if (cs && cs.includes(q)) return 60;
    if (nm && nm.includes(q)) return 40;
    if (fl.includes(q)) return 20;
    return 0;
}

function doSearch(raw) {
    const q = norm(raw ?? input.value);

    // limpiar selección de detalle
    state.current = null;
    state.query = q;

    if (!q) { state.results = []; renderResults(); return; }

    const scored = [];
    for (const e of state.all) {
        const s = scoreEntry(e, q);
        if (s > 0) scored.push([s, e]);
    }
    scored.sort((a, b) =>
        b[0] - a[0] ||
        (a[1].callsign || '').localeCompare(b[1].callsign || '') ||
        a[1].fileName.localeCompare(b[1].fileName)
    );

    state.results = scored.map(x => x[1]);
    renderResults();
}

function getVisible() {
    return state.results.filter(e =>
        (!state.band || e.band === state.band) &&
        (!state.mode || e.mode === state.mode)
    );
}

/* ============================================================
   9. SUGERENCIAS
   ============================================================ */
function renderSuggestions() {
    const q = norm(input.value);
    if (!q || q.length < 2) { suggestions.classList.remove('show'); suggestions.innerHTML = ''; return; }

    const map = new Map();
    for (const e of state.all) {
        if (!e.callsign) continue;
        if (!e.callsign.includes(q)) continue;
        if (!map.has(e.callsign)) map.set(e.callsign, 0);
        map.set(e.callsign, map.get(e.callsign) + 1);
    }
    if (!map.size) { suggestions.classList.remove('show'); suggestions.innerHTML = ''; return; }

    const items = [...map.entries()]
        .sort((a, b) => (b[1] - a[1]) || a[0].localeCompare(b[0]))
        .slice(0, 6);

    suggestions.innerHTML = items.map(([cs, n]) => `
        <li data-cs="${esc(cs)}">
            <span><i class="fas fa-id-badge" style="color:var(--caribe);margin-right:8px"></i>${esc(cs)}</span>
            <span class="sug-meta">${n}</span>
        </li>`).join('');

    suggestions.classList.add('show');
}

/* ============================================================
   10. RENDER
   ============================================================ */
function renderStatus() {
    const n = state.all.length;

    statusDot.className = 'status-dot';
    if (state.source === 'none') {
        statusDot.classList.add('warn');
        statusText.textContent = t('status.none');
    } else {
        statusDot.classList.add('ok');
        const base = state.source === 'index' ? t('status.index') : t('status.folder');
        statusText.textContent = base + ' · ' + t('status.count', { n });
    }

    // botones
    genIndexBtn.hidden = state.source !== 'folder';
    filtersBar.hidden = n === 0;
}

function showMessage(icon, html, hint) {
    resultMessage.hidden = false;
    resultMessage.innerHTML =
        `<i class="fas ${icon}"></i><span>${html}</span>` +
        (hint ? `<small>${hint}</small>` : '');
}

function hideViews() {
    gridView.classList.remove('active');
    tableView.classList.remove('active');
    detailView.classList.remove('active');
    gridActions.hidden = true;
}

function renderResults() {
    hideViews();

    /* --- Vista detalle --- */
    if (state.current) {
        resultMessage.hidden = true;
        renderDetail(state.current);
        detailView.classList.add('active');
        return;
    }

    /* --- Sin imágenes cargadas --- */
    if (!state.all.length) {
        showMessage('fa-folder-open', t('message.noImages'), t('message.noImagesHint'));
        return;
    }

    /* --- Sin búsqueda --- */
    if (!state.query) {
        showMessage('fa-radio', t('message.waiting'));
        return;
    }

    const visible = getVisible();

    /* --- Sin resultados --- */
    if (!visible.length) {
        showMessage('fa-magnifying-glass',
            `<span class="warm">${esc(state.query)}</span> · ${t('message.noResults')}`,
            t('message.noResultsHint', { q: esc(state.query) }));
        return;
    }

    /* --- Con resultados --- */
    resultMessage.hidden = true;
    gridActions.hidden = false;
    filtersBar.hidden = false;

    if (state.view === 'grid') {
        renderGrid(visible);
        gridView.classList.add('active');
    } else {
        renderTable(visible);
        tableView.classList.add('active');
    }
}

/* ============================================================
   11. DESCARGAS
   ============================================================ */
async function getBlob(entry) {
    if (entry.file) return entry.file;
    const res = await fetch(entry.url);
    if (!res.ok) throw new Error('No se pudo leer ' + entry.fileName);
    return res.blob();
}

function triggerDownload(url, filename) {
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    a.remove();
}

async function downloadOne(entry) {
    try {
        if (entry.file) {
            triggerDownload(entry.url, entry.fileName);
        } else {
            const blob = await getBlob(entry);
            const url = URL.createObjectURL(blob);
            triggerDownload(url, entry.fileName);
            setTimeout(() => URL.revokeObjectURL(url), 4000);
        }
    } catch (err) {
        alert('⚠️ ' + err.message);
    }
}

async function downloadZip(entries) {
    if (!entries.length) return;

    const original = downloadAllBtn.innerHTML;
    downloadAllBtn.disabled = true;
    downloadAllBtn.innerHTML = '<span class="spinner" style="width:16px;height:16px;border-width:3px"></span> ZIP...';

    try {
        const zip = new JSZip();
        const used = new Set();

        for (const e of entries) {
            try {
                const blob = await getBlob(e);
                let fname = e.fileName;
                let n = 1;
                while (used.has(fname)) {
                    fname = e.fileName.replace(/(\.[^.]+)$/, `_${n++}$1`);
                }
                used.add(fname);
                zip.file(fname, blob);
            } catch (err) {
                console.warn('[QSL] omitido:', e.fileName, err);
            }
        }

        const content = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE' });
        const url = URL.createObjectURL(content);
        triggerDownload(url, `QSL_${state.query || 'TODAS'}_${Date.now()}.zip`);
        setTimeout(() => URL.revokeObjectURL(url), 6000);
    } finally {
        downloadAllBtn.disabled = false;
        downloadAllBtn.innerHTML = original;
    }
}

/* Genera un index.json a partir de la carpeta cargada */
function generateIndex() {
    const items = state.all.map(e => ({
        file: e.fileName,
        callsign: e.callsign || '',
        name: e.name || '',
        band: e.band || '',
        mode: e.mode || '',
        date: e.date || ''
    }));
    const blob = new Blob([JSON.stringify(items, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    triggerDownload(url, 'index.json');
    setTimeout(() => URL.revokeObjectURL(url), 4000);
}

input.addEventListener('input', () => {
    renderSuggestions();
    clearTimeout(debounceId);

        suggestions.classList.remove('show');

        suggestions.classList.remove('show');

});

    input.focus();
}

/* Sugerencias */
suggestions.addEventListener('click', ev => {
    const li = ev.target.closest('li[data-cs]');
    if (!li) return;
    input.value = li.dataset.cs;
    suggestions.classList.remove('show');
    doSearch(li.dataset.cs);
});

document.addEventListener('click', ev => {
    if (!ev.target.closest('.suggestions') && ev.target !== input) {
        suggestions.classList.remove('show');
    }
});

/* Filtros */
bandFilter.addEventListener('change', () => {
    state.band = bandFilter.value;
    state.current = null;
    renderResults();
});
modeFilter.addEventListener('change', () => {
    state.mode = modeFilter.value;
    state.current = null;
    renderResults();
});

/* Vistas */
viewGridBtn.addEventListener('click', () => setView('grid'));
viewTableBtn.addEventListener('click', () => setView('table'));

function setView(v) {
    state.view = v;
    viewGridBtn.classList.toggle('active', v === 'grid');
    viewTableBtn.classList.toggle('active', v === 'table');
    renderResults();
}

/* Delegación: abrir detalle */
gridView.addEventListener('click', ev => {
    const item = ev.target.closest('.grid-item[data-id]');
    if (!item) return;
    openDetail(item.dataset.id);
});

tableBody.addEventListener('click', ev => {
    const btn = ev.target.closest('button[data-id]');
    if (!btn) return;
    openDetail(btn.dataset.id);
});

function openDetail(id) {
    const entry = state.all.find(e => e.id === id) || state.results.find(e => e.id === id);
    if (!entry) return;
    state.current = entry;
    renderResults();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* Descargar ZIP de los visibles */
downloadAllBtn.addEventListener('click', () => downloadZip(getVisible()));

/* Carpeta local */
loadFolderBtn.addEventListener('click', () => folderInput.click());
folderInput.addEventListener('change', ev => {
    if (ev.target.files && ev.target.files.length) {
        loadFromFolder(ev.target.files);
        ev.target.value = '';
    }
});

/* Generar índice */
genIndexBtn.addEventListener('click', generateIndex);

/* Idioma */
languageSelect.value = lang;
languageSelect.addEventListener('change', () => {
    lang = languageSelect.value;
    localStorage.setItem('qsl.lang', lang);
    applyI18n();
});

/* ============================================================
   13. APLICAR IDIOMA
   ============================================================ */
function applyI18n() {
    document.documentElement.lang = lang;
    document.title = t('app.title');

    document.querySelectorAll('[data-i18n]').forEach(el => {
        el.textContent = t(el.dataset.i18n);
    });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        el.placeholder = t(el.dataset.i18nPlaceholder);
    });

    buildFilterOptions();
    renderStatus();
    renderResults();
}

/* ============================================================
   14. ARRANQUE
   ============================================================ */
async function init() {
    applyI18n();                       // pinta textos base
    setView('table');
    const ok = await loadIndex();      // intenta cargar imagenes/index.json
    if (ok) {
        buildFilterOptions();
        renderStatus();
        showMessage('fa-circle-check',
            t('status.index'),
            t('status.count', { n: state.all.length }) + ' — ' + t('helper.text'));
    } else {
        renderStatus();
        renderResults();
    }
}

init();

})();
</script>
</body>
</html>
